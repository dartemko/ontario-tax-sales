name: Weekly Ontario Tax Sale Scraper

on:
  schedule:
    - cron: '0 0 * * 0' # Runs every Sunday at midnight
  workflow_dispatch:

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
      # 1. Updated to latest actions/checkout (removes Node 20 warning)
      - name: Checkout Repository
        uses: actions/checkout@v7

      # 2. Updated to latest actions/setup-python (removes Node 20 warning)
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 4. Execute the Python scraper
      - name: Run Scraper Script
        run: python scraper.py

      # 5. Commit & push updated listings.json
      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add listings.json
          git commit -m "Auto-update tax sale listings.json [skip ci]" || exit 0
          git push